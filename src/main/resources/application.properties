spring.application.name=clone

# PostgreSQL (run docker-compose up -d first)
spring.datasource.url=jdbc:postgresql://localhost:5432/leetcode
spring.datasource.username=leetcode
spring.datasource.password=leetcode
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator + Prometheus
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# Docker sandbox images (build from docker/ directory first)
docker.image.java=leetcode-java-sandbox
docker.image.python=leetcode-python-sandbox
docker.image.cpp=leetcode-cpp-sandbox

# Sandbox resource limits
docker.memory.bytes=268435456
docker.cpu.quota=50000
docker.cpu.period=100000
docker.timeout.compile.seconds=10
docker.timeout.run.seconds=2
docker.pool.size=5
